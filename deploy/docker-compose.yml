# deploy/docker-compose.yml
# Run from the deploy/ directory: docker compose up --build
# Environment variables are read from deploy/.env (copy from .env.example).

services:
  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    expose:
      - "3000"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /var/app/financial-cashflow/uploads
      EXPORTS_DIR: /var/app/financial-cashflow/exports
    volumes:
      - uploads_data:/var/app/financial-cashflow/uploads
      - exports_data:/var/app/financial-cashflow/exports
    expose:
      - "8000"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  uploads_data:
  exports_data: